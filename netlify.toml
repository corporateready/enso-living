  [build]
  command = "next build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"
  NEXT_PRIVATE_BUILD_WORKER = "1"

[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    
[[headers]]
  for = "*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Preconnect для сторонних ресурсов
[[headers]]
  for = "/*"
  [headers.values]
    Link = '''
    </fonts/inter.woff2>; rel=preload; as=font; type=font/woff2; crossorigin=anonymous,
    '''